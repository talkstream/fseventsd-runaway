<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Before and after restarting fseventsd: memory 24 GB to 7.4 MB, swap 13.2 to 1.5 GB, CPU temperature 70.3 to 57.6 C, power 21.2 to 12.6 W">
<title>Before and after restarting fseventsd: memory 24 GB to 7.4 MB, swap 13.2 to 1.5 GB, CPU temperature 70.3 to 57.6 C, power 21.2 to 12.6 W</title>
<rect width="1200" height="675" fill="#fcfcfb"/>
<text x="40" y="52" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#0b0b0b" text-anchor="start">One restart, and the Mac got its headroom back</text>
<text x="620" y="112" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#52514e" text-anchor="middle">BEFORE</text>
<text x="960" y="112" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#52514e" text-anchor="middle">AFTER RESTART</text>
<rect x="40" y="130" width="1120" height="74" rx="10" fill="#f1f0ec"/>
<text x="64" y="177.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#0b0b0b" text-anchor="start">fseventsd memory</text>
<circle cx="450" cy="168.0" r="7" fill="#eb6834"/>
