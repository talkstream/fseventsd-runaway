<text x="620" y="345.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b0b0b" text-anchor="middle">13.2 GB</text>
<text x="785" y="345.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#52514e" text-anchor="middle">→</text>
<circle cx="860" cy="336.0" r="7" fill="#2a78d6"/>
<text x="960" y="345.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b0b0b" text-anchor="middle">1.5 GB</text>
<rect x="40" y="382" width="1120" height="74" rx="10" fill="#f1f0ec"/>
<text x="64" y="429.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#0b0b0b" text-anchor="start">CPU temperature</text>
<circle cx="450" cy="420.0" r="7" fill="#eb6834"/>
<text x="620" y="429.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b0b0b" text-anchor="middle">70.3 °C</text>
<text x="785" y="429.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#52514e" text-anchor="middle">→</text>
