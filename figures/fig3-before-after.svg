<text x="960" y="429.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b0b0b" text-anchor="middle">57.6 °C</text>
<rect x="40" y="466" width="1120" height="74" rx="10" fill="#f1f0ec"/>
<text x="64" y="513.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#0b0b0b" text-anchor="start">System power</text>
<circle cx="450" cy="504.0" r="7" fill="#eb6834"/>
<text x="620" y="513.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b0b0b" text-anchor="middle">21.2 W</text>
<text x="785" y="513.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#52514e" text-anchor="middle">→</text>
<circle cx="860" cy="504.0" r="7" fill="#2a78d6"/>
<text x="960" y="513.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b0b0b" text-anchor="middle">12.6 W</text>
<text x="40" y="620" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start">Temperature and power: 10 one-second macmon samples each. Memory: footprint, then RSS. Load not controlled.</text>
<text x="1160" y="654" text-anchor="end" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#52514e">Data: macOS diagnostics on one MacBook Pro M3 Pro, Sep–Oct 2026</text>
