<text x="785" y="177.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#52514e" text-anchor="middle">→</text>
<circle cx="860" cy="168.0" r="7" fill="#2a78d6"/>
<text x="960" y="177.0" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0b0b0b" text-anchor="middle">7.4 MB</text>
