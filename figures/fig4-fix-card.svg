<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Fix card: check, save evidence, restart fseventsd; kickstart is blocked by SIP and restarting wipes event history">
<title>Fix card: check, save evidence, restart fseventsd; kickstart is blocked by SIP and restarting wipes event history</title>
<rect width="1200" height="675" fill="#fcfcfb"/>
<text x="40" y="52" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#0b0b0b" text-anchor="start">The fix: check → save evidence → restart</text>
<rect x="40" y="84" width="1120" height="116" rx="12" fill="#f1f0ec"/>
<circle cx="92" cy="142" r="30" fill="#2a78d6"/>
<text x="92" y="152" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="142" y="124" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b0b0b" text-anchor="start">Check</text>
<rect x="142" y="138" width="470" height="46" rx="8" fill="#1a1a19"/>
<text x="160" y="170" font-family="Menlo, 'SF Mono', monospace" font-size="24" font-weight="normal" fill="#ffffff" text-anchor="start">bash fseventsd-check.sh</text>
<text x="640" y="150" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start">Is fseventsd the one eating</text>
<text x="640" y="178" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start">memory and CPU?</text>
<rect x="40" y="212" width="1120" height="116" rx="12" fill="#f1f0ec"/>
<circle cx="92" cy="270" r="30" fill="#2a78d6"/>
<text x="92" y="280" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="142" y="252" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b0b0b" text-anchor="start">Save evidence</text>
<rect x="142" y="266" width="470" height="46" rx="8" fill="#1a1a19"/>
<text x="160" y="298" font-family="Menlo, 'SF Mono', monospace" font-size="24" font-weight="normal" fill="#ffffff" text-anchor="start">sudo bash fseventsd-restart.sh</text>
<text x="640" y="278" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start">The script saves evidence</text>
<text x="640" y="306" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start">first, before touching anything.</text>
<rect x="40" y="340" width="1120" height="116" rx="12" fill="#f1f0ec"/>
<circle cx="92" cy="398" r="30" fill="#2a78d6"/>
<text x="92" y="408" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="142" y="380" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b0b0b" text-anchor="start">Restart</text>
<rect x="142" y="394" width="470" height="46" rx="8" fill="#1a1a19"/>
<text x="160" y="426" font-family="Menlo, 'SF Mono', monospace" font-size="24" font-weight="normal" fill="#ffffff" text-anchor="start">kill -TERM &lt;pid&gt;</text>
<text x="640" y="406" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start">Run by the script; launchd</text>
<text x="640" y="434" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#52514e" text-anchor="start">respawns the daemon at once.</text>
<rect x="40" y="472" width="1120" height="96" rx="12" fill="#fdeee6" stroke="#eb6834" stroke-width="3"/>
<text x="70" y="512" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0b0b0b" text-anchor="start">Warning</text>
<text x="190" y="512" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#0b0b0b" text-anchor="start">launchctl kickstart is blocked by SIP;</text>
<text x="70" y="548" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#0b0b0b" text-anchor="start">restarting wipes event history — save evidence first.</text>
<text x="1160" y="654" text-anchor="end" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#52514e">Data: macOS diagnostics on one MacBook Pro M3 Pro, Sep–Oct 2026</text>
</svg>
